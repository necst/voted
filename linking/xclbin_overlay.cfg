[connectivity]
nk = mm2s:1:mm2s_0
nk = s2mm:1:s2mm_0
nk = krnl_vadd_stream:1:krnl_vadd_stream_0

slr = mm2s_0:SLR0
slr = s2mm_0:SLR0
slr = krnl_vadd_stream_0:SLR0

sp = s2mm_0.m_axi_gmem1:MC_NOC0
sp = mm2s_0.m_axi_gmem1:MC_NOC0
sp = mm2s_0.m_axi_gmem2:MC_NOC0


stream_connect = mm2s_0.outA:krnl_vadd_stream_0.s_axis_a
stream_connect = mm2s_0.outB:krnl_vadd_stream_0.s_axis_b
stream_connect = krnl_vadd_stream_0.m_axis_out:s2mm_0.input_stream

[vivado]
# use following line to improve the hw_emu running speed affected by platform
prop=fileset.sim_1.xsim.elaborate.xelab.more_options={-override_timeprecision -timescale=1ns/1ps}

